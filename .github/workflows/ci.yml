name: PhishGuard AI - CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Lint Code (Syntax Errors & Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Verify Core Modules Syntax & Imports
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import url_features, risk_engine, risk_fusion, exe_analyzer, apk_analyzer, rate_limit, auth"

      - name: Run Backend Integration & Health Verification
        run: |
          # Start backend in background
          cd backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          python test_integration.py
