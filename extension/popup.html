<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --safe: #10b981;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .logo-text h3 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .logo-text p {
      font-size: 10px;
      color: var(--muted);
    }
    .current-url {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      font-family: monospace;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .score-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(16, 185, 129, 0.1);
      border: 3px solid var(--safe);
      transition: all 0.3s;
    }
    .score-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--safe);
    }
    .status-badge {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--safe);
      margin-bottom: 4px;
    }
    .status-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .btn-action {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-scan {
      background: #2563eb;
      color: #fff;
    }
    .btn-scan:hover {
      background: #1d4ed8;
    }
    .btn-dashboard {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid var(--border);
      text-decoration: none;
    }
    .btn-dashboard:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">
      <h3>PhishGuard Shield</h3>
      <p>Sun'iy intellektli kiber-qalqon</p>
    </div>
  </div>

  <div class="current-url" id="tab-url">Manzil aniqlanmoqda...</div>

  <div class="status-card">
    <div class="score-circle" id="score-circle">
      <span class="score-val" id="score-val">0%</span>
    </div>
    <div class="status-badge" id="status-badge">Tekshirilmoqda...</div>
    <div class="status-desc" id="status-desc">Sahifa xavfsizligi tahlil qilinmoqda</div>
  </div>

  <button class="btn-action btn-scan" id="btn-rescan">🔄 Saytni Qayta Tekshirish</button>
  <a href="http://127.0.0.1:8000" target="_blank" class="btn-action btn-dashboard">📊 SOC Boshqaruv Panelini Ochish</a>

  <div class="footer">PhishGuard AI v1.0 | Bitiruv Malakaviy Ishi</div>

  <script src="popup.js"></script>
</body>
</html>
