<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="100%" stop-color="#01060e"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Aura -->
  <path d="M32 4 L56 15 C56 42 32 58 32 60 C32 58 8 42 8 15 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Shield Body -->
  <path d="M32 5 L55 15.5 C55 41 32 57 32 59 C32 57 9 41 9 15.5 Z" 
        fill="url(#darkBg)" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- High-tech Internal Hex / Grid Lines -->
  <path d="M32 12 L47 19.5 C47 38 32 49 32 51 C32 49 17 38 17 19.5 Z" 
        fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.35" stroke-dasharray="3, 3"/>

  <!-- Central AI Neural Diamond Core -->
  <path d="M32 19 L43 32 L32 45 L21 32 Z" 
        fill="url(#darkBg)" stroke="url(#shieldGrad)" stroke-width="2"/>

  <!-- Inner Glowing Core Pulse -->
  <circle cx="32" cy="32" r="5.5" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>

  <!-- Cyber Ray Connectors -->
  <line x1="32" y1="12" x2="32" y2="19" stroke="#00ffaa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="45" x2="32" y2="51" stroke="#00ffaa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="21" y2="32" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="43" y1="32" x2="47" y2="32" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
